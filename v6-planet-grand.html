  const i = document.createElement('input'); i.className = 'ed'; i.value = nm.textContent; i.maxLength = 20; i.spellcheck = false;
  nm.style.display = 'none'; nm.before(i); editing = i; who.classList.add('edit'); hint.textContent = 'Enter 저장 · Esc 취소';
  i.focus(); i.select();
  i.addEventListener('keydown', e => { if (e.key === 'Enter') save(i.value); if (e.key === 'Escape') cancel(); });
  i.addEventListener('blur', () => save(i.value));
}
function detach() { cancel(); who.classList.add('ask'); hint.textContent = '떼려면 한 번 더 누르세요'; }
let curKey = 'mars';
$(A, '.ren').addEventListener('click', rename); $(A, '.del').addEventListener('click', () => who.classList.contains('ask') ? cancel() : detach());
async function show(key) {
  const p = P[key], me = ++cur; curKey = key;
  [A, B].forEach(s => {
    s.style.setProperty('--ac', p.ac);
    s.querySelectorAll('.mis').forEach(e => e.innerHTML = s === A ? `<span class="m">MISSION ·</span> <b>${p.cat}</b>` : `<b>${p.cat}</b> · ${p.s[3][1]} 집중`);
    $(s, '.prev').textContent = `‹ ${p.prev}`; $(s, '.next').textContent = `${p.next} ›`;
    $(s, '.pl').getContext('2d').clearRect(0, 0, 9999, 9999);
  });
  $(A, '.cat').textContent = names[key] || p.cat;
  $(A, '#tA').textContent = p.en; $(B, '#tB').textContent = p.en; 
  $(A, '.tm').textContent = `${p.s[3][1]} 집중`;
  $(A, '.pic').innerHTML = `<svg aria-hidden="true"><use href="#pl-${key}"/></svg>`;
  cancel();
  $(B, '.stats').innerHTML = p.s.slice(0, 3).map(([k, v]) => `<div><div class="k">${k}</div><div class="sv">${v}</div></div>`).join('') + `<div><div class="m">${p.no} / 08</div></div>`;
  fitTitle();
  const T = await load(p.f); if (me !== cur) return;
  planet($(A, '.pl'), T, { cx: 340, cy: 215 + 560, R: 560, L: [-.8, -.5, .32], pitch: 1.2, lon: p.lon, atm: p.atm, ak: p.ak, aw: 9 });
  planet($(B, '.pl'), T, { cx: 630, cy: -130, R: 400, L: [-.85, .12, .5], pitch: -.42, lon: p.lon + .9, atm: p.atm, ak: p.ak, aw: 7 });
}
document.querySelectorAll('.gw button').forEach(b => b.addEventListener('click', () => show(b.dataset.p)));
const fit = () => document.querySelectorAll('.fr').forEach(f => { const k = f.clientWidth / W; f.firstElementChild.style.transform = `scale(${k})`; f.style.height = H * k + 'px'; });
addEventListener('resize', fit); fit();
(document.fonts?.ready || Promise.resolve()).then(fitTitle);
const qp = new URLSearchParams(location.search);
show(qp.get('p') || 'mars').then(() => { if (qp.get('edit')) rename(); if (qp.get('ask')) detach(); });
})();
</script>
